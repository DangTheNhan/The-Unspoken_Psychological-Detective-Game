server:
  port: ${SERVER_PORT:8080}

spring:
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:thenhan123}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      mail.smtp.starttls.required: ${SMTP_STARTTLS:true}
      mail.smtp.ssl.enable: ${SMTP_SSL:false}
      mail.smtp.ssl.checkserveridentity: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/detective_game?createDatabaseIfNotExist=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:thenhan123} # KHÔNG ghi mật khẩu vào file — đặt biến môi trường DB_PASSWORD (TD-02)
  jpa:
    hibernate:
      # Schema do db/schema.sql (Project.docx §2.1) quản lý.
      # validate = Hibernate chỉ KIỂM TRA entity khớp bảng, không tự sửa bảng -> lệch là báo lỗi ngay khi khởi động.
      # Máy dev cũ đã có bảng do ddl-auto=update tạo: xem README mục "Khởi tạo CSDL".
      ddl-auto: ${JPA_DDL_AUTO:validate}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

app:
  account:
    google-client-id: ${GOOGLE_CLIENT_ID:}
    frontend-url: ${FRONTEND_URL:http://localhost:5173}
    mail-from: ${MAIL_FROM:}
    reset-token-minutes: 30
  jwt:
    # Project.docx §4.2: Secret Key cấu hình trong application.yml. Bắt buộc >= 32 byte.
    secret: ${JWT_SECRET:change-this-development-secret-to-a-long-random-value}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    # Project.docx §4.2: cho phép Frontend React (Vite dev server mặc định cổng 5173)
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  admin:
    # Tài khoản Admin duy nhất được khởi tạo tự động khi khởi động (DEC-024)
    username: ${ADMIN_USERNAME:admin}
    email: ${ADMIN_EMAIL:admin@k-estate.local}
    password: ${ADMIN_PASSWORD:admin123}

logging:
  level:
    # Debug: đặt LOG_LEVEL_APP=DEBUG để xem chi tiết JWT, request...
    com.capstone.detectivegame: ${LOG_LEVEL_APP:INFO}
    # Đặt LOG_SQL=DEBUG để in câu SQL Hibernate sinh ra
    org.hibernate.SQL: ${LOG_SQL:WARN}
