server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/detective_game?createDatabaseIfNotExist=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  jpa:
    hibernate:
      # Schema do db/schema.sql (Project.docx §2.1) quản lý.
      # validate = Hibernate chỉ KIỂM TRA entity khớp bảng, không tự sửa bảng -> lệch là báo lỗi ngay khi khởi động.
      # Máy dev cũ đã có bảng do ddl-auto=update tạo: xem README mục "Khởi tạo CSDL".
      ddl-auto: ${JPA_DDL_AUTO:validate}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    # Project.docx §4.2: Secret Key cấu hình trong application.yml. Bắt buộc >= 32 byte.
    secret: ${JWT_SECRET:change-this-development-secret-to-a-long-random-value}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    # Project.docx §4.2: cho phép Frontend React (Vite dev server mặc định cổng 5173)
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    # Debug: đặt LOG_LEVEL_APP=DEBUG để xem chi tiết JWT, request...
    com.capstone.detectivegame: ${LOG_LEVEL_APP:INFO}
    # Đặt LOG_SQL=DEBUG để in câu SQL Hibernate sinh ra
    org.hibernate.SQL: ${LOG_SQL:WARN}
